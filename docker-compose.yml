services:
  app:
    build:
      context: ./infrastructure/php
    image: simplyfood-app
    env_file: .env
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [simplyfood]

  web:
    build:
      context: ./infrastructure/nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
    depends_on: [app]
    networks: [simplyfood]

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-simplyfood}
      MYSQL_USER: ${DB_USERNAME:-simplyfood}
      MYSQL_PASSWORD: ${DB_PASSWORD:-simplyfood}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [simplyfood]

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks: [simplyfood]

  node:
    image: node:20-bookworm
    working_dir: /app
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    command: sh -c "if [ ! -d node_modules/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [simplyfood]

volumes:
  backend_vendor:
  frontend_node_modules:
  mysql_data:
  redis_data:

networks:
  simplyfood:
    driver: bridge
