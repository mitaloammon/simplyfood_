services:
  app:
    environment:
      HOME: /tmp
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor

  node:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      npm_config_cache: /tmp/npm-cache
      HOME: /tmp
